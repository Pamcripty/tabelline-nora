    function submitAnswer(n,button){if(answered||!question)return;const correct=question.a*question.b;if(n!==correct){attempts++;if(button){button.classList.add('wrong');button.disabled=true;}else{gameInput='';$('#numberDisplay').textContent='—';$('#checkButton').disabled=true;}assisted=true;$('#feedback').className='feedback try';$('#feedback').textContent=nextPhrase('tryAgain');if(!$('#helpSpot').innerHTML)showHint();say($('#feedback').textContent);return;}
      answered=true;if(button)button.classList.add('correct');for(const selector of ['[data-answer]','[data-key]','[data-slot]','[data-pad]'])app.querySelectorAll(selector).forEach(b=>b.disabled=true);if(data.world==='unicorni')$('#jumpButton').disabled=true;$('#hintButton').hidden=true;
      const id=factId(question.a,question.b),previous=data.facts[id]||{best:0,tries:0};data.facts[id]={best:Math.min(3,Number(previous.best||0)+(!assisted&&attempts===0?1:0)),tries:Number(previous.tries||0)+1};data.stars++;if(assisted)session.helped++;else session.firstTry++;save();updateChrome();$('#feedback').className='feedback good';const winText={gioielli:'La collana è pronta! ✦',unicorni:'L’unicorno è arrivato! ✦',palco:'Il palco si illumina! ✦',tigri:'Pista trovata! ✦'};const phrase=nextPhrase(assisted?'guided':'success');$('#feedback').textContent=`${winText[data.world]} ${phrase}`;say(phrase);const continueButton=document.createElement('button');continueButton.className='btn btn-primary';continueButton.id='continueButton';continueButton.textContent=session.index===session.queue.length-1?'Vedi le mie stelle ✨':'Avanti →';continueButton.onclick=()=>{session.index++;nextQuestion();};$('.game-bottom').appendChild(continueButton);continueButton.focus({preventScroll:true});continueButton.scrollIntoView({block:'nearest',behavior:data.calm?'instant':'smooth'});
    }
    function summary(){screen='summary';updateChrome();const w=selectedWorld(),s=session;data.missions++;save();app.innerHTML=`<div class="panel summary"><div class="summary-emoji" aria-hidden="true">${w.emoji}</div><p class="eyebrow" style="color:#7354a4">Missione completata!</p><h1>Che bella avventura, ${playerName()}!</h1><p>Hai raccolto <strong>${s.queue.length} stelle</strong> nel ${w.name.toLowerCase()}.</p><p class="motivation-line">${nextPhrase('mission')}</p><div class="badge-row"><span class="badge">✦ ${s.queue.length} stelle</span><span class="badge">💡 ${s.helped} con un aiuto</span><span class="badge">🌟 ${s.firstTry} da sola</span></div><p>${data.missions<=3?'Hai scoperto una nuova gemma per il tuo laboratorio!':'Il tuo laboratorio di collane è pronto quando vuoi.'}</p><div class="actions"><button class="btn btn-primary" id="againButton">Un'altra missione</button><button class="btn btn-secondary" id="craftSummaryButton">Crea una collana 💎</button><button class="btn btn-secondary" id="mapButton">Scegli un mondo</button></div></div>`;$('#againButton').onclick=()=>s.mix?startMix():startMission(s.table);$('#craftSummaryButton').onclick=atelier;$('#mapButton').onclick=home;}
    function reviewFact(n){return {a:Math.floor((n-1)/10)+1,b:(n-1)%10+1};}
    function reviewRows(){return Array.from({length:10},(_,i)=>{const a=i+1,done=Array.from({length:10},(_,j)=>({b:j+1,result:data.review.results[factId(a,j+1)]})),attempted=done.filter(x=>x.result).length,independent=done.filter(x=>x.result?.firstTry).length,practice=done.filter(x=>x.result&&!x.result.firstTry).map(x=>`${a}×${x.b}`);return `<div class="review-row ${attempted?'':'pending'}"><strong>Tabellina del ${a}: ${independent}/${attempted} risposte immediate${attempted<10?' · in corso':''}</strong><small>${practice.length?`Da ripassare: ${practice.join(', ')}`:attempted?'Fin qui, tutte al primo tentativo.':'Non ancora iniziata.'}</small></div>`;}).join('');}
    function startReview(){if(data.review.next===101){reviewFinished();return;}screen='review';session=null;question=reviewFact(data.review.next);const draft=data.review.draft?.number===data.review.next?data.review.draft:null;attempts=draft&&Number.isInteger(draft.attempts)?Math.max(0,draft.attempts):0;assisted=!!draft?.assisted;answered=false;reviewInput='';renderReview();}
    function renderReview(){const {a,b}=question,step=data.review.next;updateChrome();app.innerHTML=`<div class="review-card"><div class="game-top"><button class="btn btn-ghost" id="reviewExit">← Pausa</button><span class="pill">Il giro completo · ${step}/100</span></div><div class="game-card"><div class="scene"><span>Una tabellina alla volta, senza fretta.</span><span class="figure" aria-hidden="true">🧭</span></div><div class="review-progress" aria-label="Domanda ${b} di 10 della tabellina del ${a}">${Array.from({length:10},(_,i)=>`<i class="${i+1<b?'done':i+1===b?'current':''}"></i>`).join('')}</div><div class="question-label">Tabellina del ${a} · numero ${b} di 10</div><div class="question">${a} × ${b} = ?</div><p class="question-note">Scrivi il risultato con i tasti qui sotto.</p><div class="number-display" id="numberDisplay" aria-label="Risposta inserita">—</div><div class="number-board">${[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>`<button class="num-key ${k==='⌫'?'erase':k==='OK'?'check':''}" ${k==='OK'?'id="checkButton" disabled':''} data-key="${k}" aria-label="${k==='⌫'?'Cancella una cifra':k==='OK'?'Controlla risposta':k}">${k}</button>`).join('')}</div><div id="helpSpot"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="game-bottom"><button class="hint-btn" id="hintButton">💡 Fammi vedere</button><button class="hint-btn" id="readButton">🔊 Leggi la domanda</button></div></div></div>`;$('#reviewExit').onclick=home;$('#hintButton').onclick=showHint;$('#readButton').onclick=()=>{if('speechSynthesis'in window){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`Quanto fa ${a} per ${b}?`);u.lang='it-IT';u.rate=.85;speechSynthesis.speak(u);}catch{}}};app.querySelectorAll('[data-key]').forEach(button=>button.onclick=()=>reviewKey(button.dataset.key));if(assisted)showHint();if(data.voice)say(`Quanto fa ${a} per ${b}?`);}
    function reviewKey(key){if(screen!=='review'||answered)return;if(key==='OK'){submitReview();return;}if(key==='⌫')reviewInput=reviewInput.slice(0,-1);else if(/^\d$/.test(key)&&reviewInput.length<3)reviewInput+=key;$('#numberDisplay').textContent=reviewInput||'—';$('#checkButton').disabled=!reviewInput;}
    function submitReview(){if(screen!=='review'||answered||!reviewInput)return;const correct=question.a*question.b;if(Number(reviewInput)!==correct){attempts++;assisted=true;reviewInput='';$('#numberDisplay').textContent='—';$('#checkButton').disabled=true;$('#feedback').className='feedback try';$('#feedback').textContent=nextPhrase('tryAgain');showHint();say($('#feedback').textContent);return;}answered=true;const id=factId(question.a,question.b);data.review.results[id]={firstTry:attempts===0&&!assisted,attempts:attempts+1,usedHint:assisted};data.review.draft=null;data.review.next++;data.stars++;save();updateChrome();app.querySelectorAll('[data-key]').forEach(button=>button.disabled=true);$('#hintButton').hidden=true;$('#feedback').className='feedback good';const phrase=nextPhrase(assisted?'guided':'success');$('#feedback').textContent=`Una stella per te ✦ ${phrase}`;say(phrase);const next=document.createElement('button');next.className='btn btn-primary';next.textContent=data.review.next%10===1?'Vedi questa tabellina →':'Avanti →';next.onclick=()=>data.review.next%10===1?reviewBreak(question.a):startReview();$('.game-bottom').appendChild(next);next.focus({preventScroll:true});}
    function reviewBreak(table){screen='review-break';question=null;const results=Array.from({length:10},(_,i)=>data.review.results[factId(table,i+1)]),independent=results.filter(r=>r?.firstTry).length;app.innerHTML=`<div class="panel summary"><div class="summary-emoji" aria-hidden="true">🌟</div><h1>Tabellina del ${table} completata!</h1><p><strong>${independent} su 10</strong> al primo tentativo, le altre con un po’ di allenamento. Puoi fermarti qui: il prossimo pezzo ti aspetta quando vuoi.</p><p class="motivation-line">${nextPhrase('review')}</p><div class="actions">${data.review.next<=100?`<button class="btn btn-primary" id="continueReview">Passa alla tabellina del ${table+1}</button>`:`<button class="btn btn-primary" id="continueReview">Guarda il percorso completo</button>`}<button class="btn btn-secondary" id="pauseReview">Per oggi basta</button></div></div>`;$('#continueReview').onclick=startReview;$('#pauseReview').onclick=home;}
    function reviewFinished(){screen='review-finished';session=null;const independent=Object.values(data.review.results).filter(r=>r?.firstTry).length;app.innerHTML=`<div class="parent-area"><div class="panel"><h2>Hai completato il giro! 🎉</h2><p>Da 1×1 fino a 10×10, una domanda per volta. <strong>${independent}/100</strong> risultati sono arrivati al primo tentativo senza indizi. Gli altri indicano cosa può essere utile ripassare; un giro solo non è un giudizio sulle sue capacità.</p><p class="motivation-line">${nextPhrase('review')}</p><div class="review-report">${reviewRows()}</div><div class="craft-actions" style="margin-top:20px"><button class="btn btn-primary" id="reviewHome">Torna al gioco</button><button class="btn btn-secondary" id="repeatReview">Rifai il giro completo</button></div></div></div>`;$('#reviewHome').onclick=home;$('#repeatReview').onclick=restartReview;}
    function restartReview(){if(!window.confirm('Vuoi rifare il giro completo? I risultati di questo giro saranno sostituiti, ma stelle e missioni resteranno.'))return;data.review={next:1,results:{},draft:null};save();startReview();}
    function atelier(){screen='atelier';session=null;updateChrome();const unlocked=Math.min(GEMS.length,3+data.missions);app.innerHTML=`<div class="craft-area"><button class="btn btn-ghost" id="backButton">← Torna alla mappa</button><div class="panel" style="margin-top:18px"><p class="eyebrow" style="color:#7751aa">Il laboratorio di ${playerName()}</p><h2>Inventiamo una collana! 💎</h2><p>Tocca le gemme per metterle in fila. Puoi cambiare idea tutte le volte che vuoi. Ogni missione svela una nuova pietra, fino a scoprirle tutte.</p><div class="necklace" aria-label="La tua collana">${Array.from({length:8},(_,i)=>`<div class="necklace-slot ${i<data.necklace.length?'filled':''}" style="${i<data.necklace.length?`background:${GEMS[data.necklace[i]].color}`:''}" aria-label="${i<data.necklace.length?GEMS[data.necklace[i]].name:'Spazio vuoto'}">${i<data.necklace.length?GEMS[data.necklace[i]].icon:''}</div>`).join('')}</div><div class="gem-list">${GEMS.map((g,i)=>`<button class="gem-choice" data-gem="${i}" ${i>=unlocked?'disabled':''}><span aria-hidden="true">${i>=unlocked?'🔒':g.icon}</span>${i>=unlocked?'Da scoprire':g.name}</button>`).join('')}</div><div class="craft-actions"><button class="hint-btn" id="undoButton" ${!data.necklace.length?'disabled':''}>↶ Togli l'ultima</button><button class="hint-btn" id="clearButton" ${!data.necklace.length?'disabled':''}>Nuova collana</button></div><p class="privacy">La collana si salva su questo tablet. Puoi tornare qui dopo una missione.</p></div></div>`;$('#backButton').onclick=home;app.querySelectorAll('[data-gem]').forEach(b=>b.onclick=()=>{if(data.necklace.length>=8){const notice=app.querySelector('.privacy');notice.textContent='La collana ha 8 gemme! Togli l’ultima o inizia una nuova collana.';return;}data.necklace.push(Number(b.dataset.gem));save();atelier();});$('#undoButton').onclick=()=>{data.necklace.pop();save();atelier();};$('#clearButton').onclick=()=>{data.necklace=[];save();atelier();};}
    function parentArea(){screen='parent';session=null;updateChrome();app.innerHTML=`<div class="parent-area"><button class="btn btn-ghost" id="backButton">← Torna al gioco</button><div class="panel"><h2>Uno sguardo ai progressi</h2><p>Le stelle celebrano ogni risposta trovata, anche con aiuto. Una tabellina arriva a 30 punti quando i suoi 10 risultati sono stati trovati tre volte ciascuno senza aiuti. Sono indicatori di esercizio, non una valutazione.</p><p><strong>Missioni completate:</strong> ${data.missions} · <strong>Stelle:</strong> ${data.stars}</p><div class="stats">${ORDER.map(t=>`<div class="stat"><strong>×${t}</strong><span>${scoreFor(t)}/30</span></div>`).join('')}</div></div><div class="panel"><h2>Il giro completo, in ordine</h2><p>${data.review.next===101?'Completato: ecco i risultati dal primo all’ultimo.':data.review.next>1?`Completate ${data.review.next-1} risposte su 100. Si può riprendere quando vuole.`:'Non ancora iniziato. ${playerName()} può farlo in blocchi di 10.'}</p><div class="review-report">${reviewRows()}</div><button class="setting" id="reviewParentButton" style="margin-top:15px">${data.review.next===101?'Vedi il riepilogo':data.review.next>1?'Riprendi il giro':'Comincia il giro'}</button></div><div class="panel"><h2>Impostazioni</h2><div class="settings-row"><div><strong>Voce durante il gioco</strong><div class="privacy">La domanda si può sempre ascoltare con il pulsante «Leggi».</div></div><button class="setting" id="voiceSetting" aria-pressed="${data.voice}">${data.voice?'Attiva':'Spenta'}</button></div><div class="settings-row"><div><strong>Modalità calma</strong><div class="privacy">Riduce effetti e movimenti grafici.</div></div><button class="setting" id="calmSetting" aria-pressed="${data.calm}">${data.calm?'Attiva':'Spenta'}</button></div><div class="settings-row"><div><strong>Ricomincia da zero</strong><div class="privacy">Cancella solo i progressi di ${playerName()} su questo tablet.</div></div><button class="setting warning" id="resetButton">Cancella</button></div><p class="privacy">Nessun account, pubblicità o tracciamento. I progressi restano nel browser di questo dispositivo. Se cancelli i dati del browser o usi un altro tablet, non si trasferiscono automaticamente.</p></div></div>`;
      $('#backButton').onclick=home;$('#reviewParentButton').onclick=startReview;$('#voiceSetting').onclick=()=>{data.voice=!data.voice;save();parentArea();};$('#calmSetting').onclick=()=>{data.calm=!data.calm;save();parentArea();};$('#resetButton').onclick=()=>{if(window.confirm(`Vuoi cancellare davvero tutte le stelle, la collana e i progressi di ${playerName()} su questo dispositivo?`)){const calm=data.calm,voice=data.voice;data={stars:0,facts:{},missions:0,calm,voice,world:'gioielli',necklace:[],review:{next:1,results:{},draft:null}};save();parentArea();}};
    }
    document.addEventListener('keydown',event=>{if(!['review','game'].includes(screen)||event.altKey||event.ctrlKey||event.metaKey)return;const key=event.key==='Backspace'?'⌫':event.key==='Enter'?'OK':event.key;if(/^\d$/.test(key)||key==='⌫'||key==='OK'){event.preventDefault();if(screen==='review')reviewKey(key);else gameKey(key);}});
    $('#homeButton').onclick=()=>profile?home():showProfiles();$('#profileButton').onclick=showProfiles;$('#soundButton').onclick=()=>{data.voice=!data.voice;save();updateChrome();if(data.voice)say(`Ciao ${playerName()}! La voce è accesa.`);else if('speechSynthesis'in window)speechSynthesis.cancel();};
    if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    showProfiles();
  })();
  </script>
</body>
</html>
